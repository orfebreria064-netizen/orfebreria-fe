<div class="auth-card">
  <div class="auth-brand">
    <span>Au</span>
    <div>
      <h1>Aurum</h1>
      <p>Gestión integral de orfebrería</p>
    </div>
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()!" />
  }

  @if (mode() === 'login') {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" placeholder="usuario@empresa.pe" />
        <app-field-error [control]="form.controls.email" />
      </div>
      <div class="field">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <button type="button" class="link-button" (click)="switchMode('reset')">¿Olvidó su contraseña?</button>
        </div>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          [fluid]="true"
        />
        <app-field-error [control]="form.controls.password" />
      </div>
      <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" [loading]="loading()" [fluid]="true" />
    </form>
    <p class="auth-footer">¿Su empresa aún no usa Aurum? <a routerLink="/solicitar-acceso">Solicitar acceso</a></p>
  } @else if (resetSent()) {
    <p-message
      severity="success"
      text="Si el correo está registrado, recibirá un enlace para crear una nueva contraseña. Revise también la carpeta de spam."
    />
    <p class="auth-footer"><button type="button" class="link-button" (click)="switchMode('login')">Volver a iniciar sesión</button></p>
  } @else {
    <p class="muted">Ingrese su correo y le enviaremos un enlace para crear una nueva contraseña.</p>
    <!-- (submit) y no (ngSubmit): sin [formGroup] Angular no gestiona este <form> y el envío recargaría la página -->
    <form (submit)="sendReset($event)" novalidate>
      <div class="field">
        <label for="reset-email">Correo electrónico</label>
        <input pInputText id="reset-email" type="email" [formControl]="form.controls.email" autocomplete="email" />
        <app-field-error [control]="form.controls.email" />
      </div>
      <p-button type="submit" label="Enviar enlace" icon="pi pi-envelope" [loading]="loading()" [fluid]="true" />
    </form>
    <p class="auth-footer"><button type="button" class="link-button" (click)="switchMode('login')">Volver a iniciar sesión</button></p>
  }
</div>
