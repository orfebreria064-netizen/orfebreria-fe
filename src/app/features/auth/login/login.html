<div class="auth-card">
  <div class="auth-brand">
    <span>Au</span>
    <div>
      <h1>Aurum</h1>
      <p>Gestión integral de orfebrería</p>
    </div>
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()!" />
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input pInputText id="email" type="email" formControlName="email" autocomplete="email" placeholder="usuario@empresa.pe" />
      <app-field-error [control]="form.controls.email" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        [fluid]="true"
      />
      <app-field-error [control]="form.controls.password" />
    </div>
    <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" [loading]="loading()" [fluid]="true" />
  </form>

  <p class="auth-footer">¿No tiene cuenta? <a routerLink="/registro">Solicitar acceso</a></p>
</div>
