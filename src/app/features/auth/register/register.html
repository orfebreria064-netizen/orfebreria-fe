<div class="auth-card">
  <div class="auth-brand">
    <span>Au</span>
    <div>
      <h1>Solicitar acceso</h1>
      <p>Un administrador activará su cuenta</p>
    </div>
  </div>

  @if (confirmEmail()) {
    <p-message severity="success" text="Cuenta creada. Revise su correo para confirmarla y luego inicie sesión." />
    <p class="auth-footer"><a routerLink="/login">Ir a iniciar sesión</a></p>
  } @else {
    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="fullName">Nombre completo</label>
        <input pInputText id="fullName" formControlName="fullName" autocomplete="name" />
        <app-field-error [control]="form.controls.fullName" />
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
        <app-field-error [control]="form.controls.email" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [toggleMask]="true"
          [fluid]="true"
          promptLabel="Mínimo 8 caracteres"
          weakLabel="Débil"
          mediumLabel="Media"
          strongLabel="Fuerte"
          autocomplete="new-password"
        />
        <app-field-error [control]="form.controls.password" />
      </div>
      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <p-password inputId="confirm" formControlName="confirm" [feedback]="false" [toggleMask]="true" [fluid]="true" autocomplete="new-password" />
        <app-field-error [control]="form.controls.confirm" groupErrorKey="mismatch" />
      </div>
      <p-button type="submit" label="Crear cuenta" icon="pi pi-user-plus" [loading]="loading()" [fluid]="true" />
    </form>
    <p class="auth-footer">¿Ya tiene cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  }
</div>
