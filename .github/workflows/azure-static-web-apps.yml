# Compila el frontend Angular y lo publica en Azure Static Web Apps en cada push a main.
# Requiere el secreto AZURE_STATIC_WEB_APPS_API_TOKEN (ver docs/DESPLIEGUE_AZURE.md, paso 3).
name: Frontend - Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/orfebreria/browser
          skip_app_build: true
          skip_api_build: true
